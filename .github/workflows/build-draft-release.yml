# build-draft-release.yml
#
# This workflow is triggered when a version tag (e.g., 1.3.17) is pushed.
# It builds the Obsidian plugin and creates a
# draft GitHub release with the three standard Obsidian plugin files:
# - main.js (production build)
# - manifest.json
# - styles.css
# It also publishes the project and third-party notices/license texts.
#
# Release metadata must already be committed and match the pushed tag.
#
# Improvements:
# - Uses latest GitHub Actions versions (v4)
# - Better concurrency control to prevent duplicate drafts
# - Improved error handling and verification
# - Cleaner release creation with softprops/action-gh-release

name: Build Draft Release

on:
  push:
    tags:
      - '*.*.*'   # Trigger on version tags like 1.2.3
      - 'v*.*.*'  # Also supports v1.2.3 format if needed

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for potential changelog generation
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Simplified caching
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify tag matches committed release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          npm run verify:release -- "$VERSION"

      - name: Run delivery checks
        run: npm run check
        
      - name: Prepare release artifact
        run: |
          cp build/main.js main.js
          echo "📦 Production main.js size:"
          ls -lh main.js

      - name: Fetch pinned LGPL corresponding source
        run: |
          curl --fail --location --silent --show-error \
            --output heic-to-1.0.2.tgz \
            https://registry.npmjs.org/heic-to/-/heic-to-1.0.2.tgz
          curl --fail --location --silent --show-error \
            --output libheif-1.18.2.tar.gz \
            https://github.com/strukturag/libheif/releases/download/v1.18.2/libheif-1.18.2.tar.gz
          curl --fail --location --silent --show-error \
            --output libde265-1.0.15.tar.gz \
            https://github.com/strukturag/libde265/releases/download/v1.0.15/libde265-1.0.15.tar.gz
          sha256sum --check <<'CHECKSUMS'
          ac85610181bb8270faff5e7b5892da9b26131c476f823e695e5b0667675884e7  heic-to-1.0.2.tgz
          c4002a622bec9f519f29d84bfdc6024e33fd67953a5fb4dc2c2f11f67d5e45bf  libheif-1.18.2.tar.gz
          00251986c29d34d3af7117ed05874950c875dd9292d016be29d3b3762666511d  libde265-1.0.15.tar.gz
          CHECKSUMS
          
      - name: Verify release files exist
        run: |
          echo "🔍 Verifying release files..."
          
          # Check the standard plugin files and compliance documents.
          for file in \
            main.js \
            manifest.json \
            styles.css \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            third-party/bundled-dependencies.json \
            licenses/Apache-2.0.txt \
            licenses/BSD-3-Clause.txt \
            licenses/GPL-3.0.txt \
            licenses/ISC.txt \
            licenses/LGPL-3.0.txt \
            licenses/MIT.txt \
            licenses/UTIF-MIT.txt \
            heic-to-1.0.2.tgz \
            libheif-1.18.2.tar.gz \
            libde265-1.0.15.tar.gz; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file ($(ls -lh $file | awk '{print $5}'))"
          done
          
          npm run verify:release -- "$VERSION" --build
          
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true  # Auto-generate release notes from commits
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_NOTICES.md
            third-party/bundled-dependencies.json
            licenses/Apache-2.0.txt
            licenses/BSD-3-Clause.txt
            licenses/GPL-3.0.txt
            licenses/ISC.txt
            licenses/LGPL-3.0.txt
            licenses/MIT.txt
            licenses/UTIF-MIT.txt
            heic-to-1.0.2.tgz
            libheif-1.18.2.tar.gz
            libde265-1.0.15.tar.gz
