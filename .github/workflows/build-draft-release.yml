# build-draft-release.yml
#
# This workflow is triggered when a version tag (e.g., 1.3.17) is pushed.
# It builds the Obsidian plugin and creates a
# draft GitHub release with the three required files:
# - main.js (production build)
# - manifest.json
# - styles.css
#
# Release metadata must already be committed and match the pushed tag.
#
# Improvements:
# - Uses latest GitHub Actions versions (v4)
# - Better concurrency control to prevent duplicate drafts
# - Improved error handling and verification
# - Cleaner release creation with softprops/action-gh-release

name: Build Draft Release

on:
  push:
    tags:
      - '*.*.*'   # Trigger on version tags like 1.2.3
      - 'v*.*.*'  # Also supports v1.2.3 format if needed

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for potential changelog generation
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Simplified caching
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify tag matches committed release metadata
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          npm run verify:release -- "$VERSION"

      - name: Run delivery checks
        run: npm run check
        
      - name: Prepare release artifact
        run: |
          cp build/main.js main.js
          echo "📦 Production main.js size:"
          ls -lh main.js
          
      - name: Verify release files exist
        run: |
          echo "🔍 Verifying release files..."
          
          # Check each required file
          for file in main.js manifest.json styles.css; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file ($(ls -lh $file | awk '{print $5}'))"
          done
          
          npm run verify:release -- "$VERSION" --build
          
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true  # Auto-generate release notes from commits
          files: |
            main.js
            manifest.json
            styles.css
